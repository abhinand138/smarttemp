databases:
  # ==========================================
  # 1. Managed PostgreSQL Database (Free Tier)
  # ==========================================
  - name: smarttemp-db
    databaseName: smarttemp_db
    user: smarttemp_user
    plan: free

services:
  # ==========================================
  # 2. Flask REST API Backend Service
  # ==========================================
  - type: web
    name: smarttemp-backend
    runtime: python
    plan: free
    rootDir: backend
    buildCommand: pip install -r requirements.txt
    startCommand: gunicorn --config gunicorn.conf.py "app:create_app()"
    envVars:
      - key: PYTHON_VERSION
        value: 3.12.10
      - key: DATABASE_URL
        fromDatabase:
          name: smarttemp-db
          property: connectionString
      - key: SECRET_KEY
        generateValue: true
      - key: CORS_ORIGINS
        value: "*"

  # ==========================================
  # 3. React Web Dashboard (Static Site)
  # ==========================================
  - type: web
    name: smarttemp-frontend
    runtime: static
    rootDir: frontend
    buildCommand: npm install && npm run build
    staticPublishPath: dist
    routes:
      - type: rewrite
        source: /*
        destination: /index.html
    envVars:
      - key: VITE_API_BASE_URL
        fromService:
          type: web
          name: smarttemp-backend
          property: host
